[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kemus"
version = "1.0.0"
description = "Kemus - PC virtuel leger, inspire KDE Plasma / NixOS / Fedora. Zero dependance Python externe."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Kemus Project" }]
keywords = ["desktop", "virtual", "kde", "nixos", "fedora", "terminal", "web-desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.urls]
Homepage = "https://localhost:3922"

[project.scripts]
kemus = "kemus:main"

[tool.setuptools]
py-modules = ["kemus"]

[tool.setuptools.package-data]
kemus = ["README.md"]
